[package]
name = "accounts-manager"
version = "0.2.0"
description = "Accounts Manager: bookkeeping for Teia Firme Lda"
authors = ["Algarve Builders"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "accounts_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# A second launch focuses the running window (the embedded database allows one process at a time).
tauri-plugin-single-instance = "2"
# The window comes back where it was.
tauri-plugin-window-state = "2"
# Random bytes for the session-signing secret, created once per PC.
getrandom = "0.3"
